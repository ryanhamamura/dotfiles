# Credits to github.com/Traap for most of this config
#
# Default prefix key

unbind-key C-b
set-option -g prefix C-Space
bind-key C-Space send-prefix

# -----------------------------------------------------------------------------
# Mouse support

set-option -g mouse on
set-option -s set-clipboard on

bind-key m \
  set-option -g mouse on \;\
  display-message '󰔡  '

bind-key M \
  set-option -g mouse off \;\
  display-message '  󰍾'


# -----------------------------------------------------------------------------
# Color support

set-option -g default-terminal "tmux-256color"
set-option -ga terminal-overrides ",tmux-256color:Tc"
set-option -g terminal-features ",tmux-256color:RGB"

# -----------------------------------------------------------------------------
# Scroll back history

set-option -g history-limit 10000

# -----------------------------------------------------------------------------
# Use prefix b <command> to send commands to a TMUX session
# inside another TMUX session.

bind-key b send-prefix

# -----------------------------------------------------------------------------
# Faster key repetition

set-option -g escape-time 0


# -----------------------------------------------------------------------------
# Window and Pane starting index

set-option -g base-index 1
set-option -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# -----------------------------------------------------------------------------
# Reload ~/.tmux config

bind-key r source-file ~/.config/tmux/tmux.conf \; display-message " Config reloaded."

